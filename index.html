<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA STORE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>JESSY<span>STORE.</span></h2>

    <nav>
      <a href="#">Início</a>
      <a href="#products">Produtos</a>
    </nav>
  </header>

  <main>

    <section class="hero">
      <p>WELCOME TO JESSY STORE</p>
      <h1>O essencial para o teu dia a dia.</h1>
      <p>Descobre a nossa seleção de produtos.</p>
      <a href="#products" class="hero-button">Ver produtos</a>
    </section>

    <section class="shop">
      <h2>Os nossos produtos</h2>
      <p>Escolhe os teus favoritos.</p>

      <div id="products"></div>
    </section>

  </main>

  <footer>
    <p>© 2026 JESSY STORE. Todos os direitos reservados.</p>
  </footer>

  <script type="module">
    import { addToCart } from "./cart.js";

    // Carregar produtos da API
    async function getProducts() {
      try {
        const response = await fetch("https://fakestoreapi.com/products");
        const products = await response.json();

        const container = document.getElementById("products");

     products.forEach(product => {
        const div = document.createElement("div");
        div.className = "product";

        div.innerHTML = `
            <img src="${product.image}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p class="price">${product.price.toFixed(2)} €</p>
            <button class="add-cart">Add to cart</button>
        `;

        const button = div.querySelector(".add-cart");

        button.addEventListener("click", () => {
            addToCart(product.id);
        });

        container.appendChild(div);
        });

      } catch (error) {
        console.log("Erro:", error);
      }
    }

    getProducts();
  </script>

  <script src="./ecommerce.js"></script>

</body>
</html>
